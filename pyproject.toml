[project]
name = "xtalgen"
version = "0.2.0"
description = "Crystal / magnetism DFT wrappers (VASP, Wannier90, TB2J) for Simstack"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Wolfgang Wenzel", email = "wolfgang.wenzel@kit.edu" }
]
dependencies = [
    "simstack",
    "TB2J",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]
# Siesta / netCDF path (sisl needs a native build — typically Linux / conda).
siesta = [
    "sisl>=0.16.2",
    "netcdf4",
]

[project.entry-points."simstack.modules"]
master = "master"
tbj2 = "tbj2"
vasp = "vasp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["master", "tbj2", "vasp"]

[tool.uv.sources]
simstack = { git = "https://github.com/simstack/simstack.git", tag = "v2.0.1" }
TB2J = { git = "https://github.com/mailhexu/TB2J.git" }

[tool.uv]
# sisl needs a native build (fails on Windows); pypao is not on PyPI; pre-commit is a
# misplaced hard dep upstream. Wannier workflows do not need any of these.
exclude-dependencies = ["sisl", "pypao", "pre-commit"]

# version is required for Git dependencies (matches TB2J's pyproject on main).
[[tool.uv.dependency-metadata]]
name = "TB2J"
version = "0.9.19"
requires-dist = [
    "numpy",
    "scipy>=1.9,<1.17",
    "matplotlib",
    "ase>=3.19",
    "tqdm",
    "pathos",
    "packaging>=20.0",
    "HamiltonIO>=0.3.8",
    "sympair>=0.1.4",
    "supercellmap",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "typing_extensions",
    "h5py",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
